<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 130" width="1100" height="130" role="img" aria-label="Records flow through the pipeline: record, reconcile, investigate, resolve">
  <defs>
    <style>
      .fp-line{stroke-dasharray:6 9;animation:fp-march 1.1s linear infinite}
      @keyframes fp-march{to{stroke-dashoffset:-30}}
      .fp-drop{animation:fp-travel 6.5s linear infinite}
      .fp-drop:nth-of-type(2){animation-delay:-2.2s;animation-duration:7.6s}
      .fp-drop:nth-of-type(3){animation-delay:-4.4s;animation-duration:5.8s}
      @keyframes fp-travel{0%{transform:translateX(0);opacity:0}7%{opacity:1}90%{opacity:1}100%{transform:translateX(880px);opacity:0}}
      .fp-node{animation:fp-glow 2.8s ease-in-out infinite}
      .fp-node:nth-of-type(2){animation-delay:.7s}
      .fp-node:nth-of-type(3){animation-delay:1.4s}
      .fp-node:nth-of-type(4){animation-delay:2.1s}
      @keyframes fp-glow{0%,100%{opacity:.55}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>

  <line class="fp-line" x1="60" y1="62" x2="1040" y2="62" stroke="#25D8D1" stroke-width="3" opacity=".6"/>
  <circle cx="60" cy="62" r="6" fill="#25D8D1"/>
  <circle cx="1040" cy="62" r="6" fill="#3188FF"/>

  <!-- traveling droplets -->
  <g>
    <path class="fp-drop" d="M66 50c0 0 -8 9.5 -8 15a8 8 0 0 0 16 0c0 -5.5 -8 -15 -8 -15Z" fill="#5FE3DD" stroke="#061A24" stroke-width="1"/>
    <path class="fp-drop" d="M66 50c0 0 -8 9.5 -8 15a8 8 0 0 0 16 0c0 -5.5 -8 -15 -8 -15Z" fill="#25D8D1" stroke="#061A24" stroke-width="1"/>
    <path class="fp-drop" d="M66 50c0 0 -8 9.5 -8 15a8 8 0 0 0 16 0c0 -5.5 -8 -15 -8 -15Z" fill="#3188FF" stroke="#061A24" stroke-width="1"/>
  </g>

  <!-- stations -->
  <g font-family="Segoe UI, sans-serif" font-size="17" font-weight="800" text-anchor="middle">
    <g class="fp-node"><circle cx="180" cy="62" r="26" fill="#0d2835" stroke="#25D8D1" stroke-width="3"/><text x="180" y="68" fill="#5FE3DD">01</text></g>
    <g class="fp-node"><circle cx="420" cy="62" r="26" fill="#0d2835" stroke="#25D8D1" stroke-width="3"/><text x="420" y="68" fill="#5FE3DD">02</text></g>
    <g class="fp-node"><circle cx="660" cy="62" r="26" fill="#0d2835" stroke="#25D8D1" stroke-width="3"/><text x="660" y="68" fill="#5FE3DD">03</text></g>
    <g class="fp-node"><circle cx="900" cy="62" r="26" fill="#0d2835" stroke="#25D8D1" stroke-width="3"/><text x="900" y="68" fill="#5FE3DD">04</text></g>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="15.5" font-weight="700" fill="#22414f" text-anchor="middle">
    <text x="180" y="112">Record</text>
    <text x="420" y="112">Reconcile</text>
    <text x="660" y="112">Investigate</text>
    <text x="900" y="112">Resolve &amp; export</text>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="12.5" fill="#52656f" text-anchor="middle">
    <text x="180" y="128">receipts · readings · meters</text>
    <text x="420" y="128">R = O + D − U − C</text>
    <text x="660" y="128">owned evidence cases</text>
    <text x="900" y="128">audit trail · PDF · CSV</text>
  </g>
</svg>
