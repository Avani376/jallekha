<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#061A24"/>
    <stop offset="1" stop-color="#0D2835"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#25D8D1" stop-opacity="0.3"/>
    <stop offset="1" stop-color="#3188FF" stop-opacity="0.08"/>
  </linearGradient>
  <linearGradient id="drop-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#25D8D1"/>
    <stop offset="1" stop-color="#3188FF"/>
  </linearGradient>
</defs>
<rect width="800" height="200" fill="url(#bg)"/>
<rect width="800" height="200" fill="url(#water)"/>

<!-- Layered waves -->
<path fill="#25D8D1" opacity="0.06">
  <animate attributeName="d" dur="8s" repeatCount="indefinite"
    values="M0,100 Q100,80 200,100 T400,100 T600,100 T800,100 V200 H0 Z;
            M0,100 Q100,120 200,100 T400,100 T600,100 T800,100 V200 H0 Z;
            M0,100 Q100,80 200,100 T400,100 T600,100 T800,100 V200 H0 Z"/>
</path>
<path fill="#3188FF" opacity="0.05">
  <animate attributeName="d" dur="10s" repeatCount="indefinite"
    values="M0,120 Q150,100 300,120 T600,120 T800,120 V200 H0 Z;
            M0,120 Q150,140 300,120 T600,120 T800,120 V200 H0 Z;
            M0,120 Q150,100 300,120 T600,120 T800,120 V200 H0 Z"/>
</path>
<path fill="#25D8D1" opacity="0.04">
  <animate attributeName="d" dur="12s" repeatCount="indefinite"
    values="M0,140 Q200,120 400,140 T800,140 V200 H0 Z;
            M0,140 Q200,160 400,140 T800,140 V200 H0 Z;
            M0,140 Q200,120 400,140 T800,140 V200 H0 Z"/>
</path>

<!-- Floating bubbles -->
<circle cx="120" cy="60" r="3" fill="#25D8D1" opacity="0.4">
  <animate attributeName="cy" values="180;40;180" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="280" cy="80" r="2" fill="#3188FF" opacity="0.3">
  <animate attributeName="cy" values="170;50;170" dur="8s" begin="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.4;0" dur="8s" begin="2s" repeatCount="indefinite"/>
</circle>
<circle cx="450" cy="50" r="4" fill="#25D8D1" opacity="0.3">
  <animate attributeName="cy" values="175;30;175" dur="7s" begin="1s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.45;0" dur="7s" begin="1s" repeatCount="indefinite"/>
</circle>
<circle cx="620" cy="70" r="2.5" fill="#3188FF" opacity="0.35">
  <animate attributeName="cy" values="180;45;180" dur="9s" begin="3s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.4;0" dur="9s" begin="3s" repeatCount="indefinite"/>
</circle>

<!-- Central water drop -->
<path d="M400 30C400 30 370 65 370 88a30 30 0 0 0 60 0C430 65 400 30 400 30Z" fill="url(#drop-grad)">
  <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="3s" repeatCount="indefinite"/>
</path>
<path d="M388 92a12 12 0 0 0 24 0" stroke="#061A24" strokeWidth="2.5" fill="none" strokeLinecap="round"/>

<!-- Title text -->
<text x="540" y="75" font-family="Manrope,sans-serif" font-size="26" font-weight="800" fill="#F5F8F7">JalLekha</text>
<text x="540" y="98" font-family="Manrope,sans-serif" font-size="13" fill="#25D8D1" font-weight="700">know what came in,</text>
<text x="540" y="115" font-family="Manrope,sans-serif" font-size="13" fill="#25D8D1" font-weight="700">what was measured,</text>
<text x="540" y="132" font-family="Manrope,sans-serif" font-size="13" fill="#25D8D1" font-weight="700">and what needs checking.</text>

<!-- Equation -->
<text x="80" y="95" font-family="Courier,monospace" font-size="14" font-weight="bold" fill="#25D8D1">R = O + D − U − C</text>
<text x="80" y="115" font-family="Courier,monospace" font-size="9" fill="#94A3B8">conservative bounds · no root-sum-square</text>

<!-- Flowing dashes (data flow) -->
<line x1="60" y1="130" x2="200" y2="130" stroke="#25D8D1" strokeWidth="1.5" strokeDasharray="6,4" opacity="0.4">
  <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.5s" repeatCount="indefinite"/>
</line>
<line x1="640" y1="130" x2="740" y2="130" stroke="#3188FF" strokeWidth="1.5" strokeDasharray="6,4" opacity="0.4">
  <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.5s" repeatCount="indefinite"/>
</line>
</svg>
