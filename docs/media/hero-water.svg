<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="JalLekha — animated deep water banner">
  <defs>
    <linearGradient id="hw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061a24"/>
      <stop offset=".62" stop-color="#0d2835"/>
      <stop offset="1" stop-color="#0e3a4a"/>
    </linearGradient>
    <linearGradient id="hw-drop" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#5FE3DD"/>
      <stop offset=".55" stop-color="#25D8D1"/>
      <stop offset="1" stop-color="#3188FF"/>
    </linearGradient>
    <linearGradient id="hw-wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25D8D1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3188FF" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="hw-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#25D8D1" stop-opacity=".5"/>
      <stop offset="1" stop-color="#25D8D1" stop-opacity="0"/>
    </radialGradient>
    <style>
      .hw-wave{animation:hw-drift 9s ease-in-out infinite}
      .hw-wave2{animation:hw-drift2 14s ease-in-out infinite}
      .hw-wave3{animation:hw-drift3 19s ease-in-out infinite}
      @keyframes hw-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(-26px)}}
      @keyframes hw-drift2{0%,100%{transform:translateX(0)}50%{transform:translateX(22px)}}
      @keyframes hw-drift3{0%,100%{transform:translateX(0)}50%{transform:translateX(-16px)}}
      .hw-bub{animation:hw-rise 7s linear infinite;opacity:0}
      .hw-bub:nth-of-type(2){animation-delay:1.1s;animation-duration:8.5s}
      .hw-bub:nth-of-type(3){animation-delay:2.4s;animation-duration:9.5s}
      .hw-bub:nth-of-type(4){animation-delay:3.7s;animation-duration:8s}
      .hw-bub:nth-of-type(5){animation-delay:5s;animation-duration:10.5s}
      .hw-bub:nth-of-type(6){animation-delay:6.2s;animation-duration:7.6s}
      @keyframes hw-rise{0%{transform:translateY(0) scale(.7);opacity:0}14%{opacity:.75}82%{opacity:.75}100%{transform:translateY(-190px) scale(1.15);opacity:0}}
      .hw-drop{animation:hw-bob 5.2s ease-in-out infinite}
      @keyframes hw-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
      .hw-glow{animation:hw-pulse 5.2s ease-in-out infinite}
      @keyframes hw-pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}
      .hw-shine{animation:hw-shine 8s linear infinite}
      @keyframes hw-shine{0%{transform:translateX(-420px)}100%{transform:translateX(420px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#hw-sky)"/>
  <circle class="hw-glow" cx="600" cy="118" r="120" fill="url(#hw-glow)"/>

  <!-- rising bubbles -->
  <g fill="none" stroke="#5FE3DD" stroke-opacity=".55">
    <circle class="hw-bub" cx="180" cy="268" r="7"/>
    <circle class="hw-bub" cx="330" cy="274" r="4.5"/>
    <circle class="hw-bub" cx="470" cy="270" r="9"/>
    <circle class="hw-bub" cx="760" cy="272" r="5.5"/>
    <circle class="hw-bub" cx="920" cy="268" r="8"/>
    <circle class="hw-bub" cx="1060" cy="274" r="4"/>
  </g>

  <!-- central droplet emblem -->
  <g transform="translate(600 108)">
    <g class="hw-drop">
      <path d="M0 -74C0 -74 -46 -16 -46 16a46 46 0 0 0 92 0C46 -16 0 -74 0 -74Z" fill="url(#hw-drop)"/>
      <path d="M-22 22a22 22 0 0 0 32 12" fill="none" stroke="#061A24" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-14" cy="6" r="8" fill="#fff" opacity=".55"/>
      <path d="M30 -34l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5Z" fill="#F2B04C">
        <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- shimmer band -->
  <rect class="hw-shine" x="180" y="196" width="120" height="80" fill="#9BEFEA" opacity=".08" transform="skewX(-16)"/>

  <!-- layered waves -->
  <path class="hw-wave3" d="M-60 236 Q 60 216 180 234 T 420 232 T 660 236 T 900 228 T 1140 234 T 1380 230 V 300 H -60 Z" fill="#3188FF" opacity=".28"/>
  <path class="hw-wave2" d="M-60 252 Q 80 232 220 250 T 500 248 T 780 252 T 1060 244 T 1300 250 V 300 H -60 Z" fill="#25D8D1" opacity=".34"/>
  <path class="hw-wave" d="M-60 270 Q 100 252 260 268 T 580 266 T 900 270 T 1220 262 V 300 H -60 Z" fill="url(#hw-wave1)" opacity=".75"/>
</svg>
