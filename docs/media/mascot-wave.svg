<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
<defs>
  <linearGradient id="mbody" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#5FE3DD"/>
    <stop offset="0.55" stop-color="#25D8D1"/>
    <stop offset="1" stop-color="#3188FF"/>
  </linearGradient>
</defs>
<rect width="200" height="220" fill="#061A24" rx="12"/>

<!-- Shadow -->
<ellipse cx="100" cy="204" rx="40" ry="7" fill="#25D8D1" opacity="0.08">
  <animate attributeName="rx" values="40;34;40" dur="3s" repeatCount="indefinite"/>
</ellipse>

<!-- Body -->
<path d="M100 22C100 22 48 82 48 122a52 52 0 0 0 104 0C152 82 100 22 100 22Z" fill="url(#mbody)">
  <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="3s" repeatCount="indefinite"/>
</path>

<!-- Belly shine -->
<ellipse cx="82" cy="68" rx="14" ry="22" fill="#fff" opacity="0.15" transform="rotate(-15 82 68)"/>

<!-- Left arm (static) -->
<path d="M55 135c-9 3-14 9-15 16" stroke="#25D8D1" strokeWidth="8" strokeLinecap="round" fill="none"/>

<!-- Right arm (waving) -->
<g>
  <animateTransform attributeName="transform" type="rotate" values="0,100,100;-30,100,100;20,100,100;-30,100,100;0,100,100" dur="2.5s" repeatCount="indefinite"/>
  <path d="M145 135c9 3 14 9 15 16" stroke="#25D8D1" strokeWidth="8" strokeLinecap="round" fill="none"/>
</g>

<!-- Eyes (blinking) -->
<g>
  <circle cx="82" cy="118" r="10" fill="#fff"/>
  <circle cx="84" cy="119" r="5" fill="#061A24"/>
  <circle cx="82" cy="116" r="1.6" fill="#fff"/>
  <animate attributeName="opacity" values="1;1;0;1;1" dur="4s" repeatCount="indefinite"/>
</g>
<g>
  <circle cx="118" cy="118" r="10" fill="#fff"/>
  <circle cx="120" cy="119" r="5" fill="#061A24"/>
  <circle cx="118" cy="116" r="1.6" fill="#fff"/>
  <animate attributeName="opacity" values="1;1;0;1;1" dur="4s" begin="0.05s" repeatCount="indefinite"/>
</g>

<!-- Blush -->
<ellipse cx="68" cy="136" rx="6.5" ry="4" fill="#FF8FA3" opacity="0.5"/>
<ellipse cx="132" cy="136" rx="6.5" ry="4" fill="#FF8FA3" opacity="0.5"/>

<!-- Smile -->
<path d="M88 142q12 10 24 0" stroke="#061A24" strokeWidth="3.5" strokeLinecap="round" fill="none"/>

<!-- Sparkles -->
<g fill="#FFD166">
  <path d="M30 50l3 6 6 3-6 3-3 6-3-6-6-3 6-3Z">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M170 44l2.5 5 5 2.5-5 2.5-2.5 5-2.5-5-5-2.5 5-2.5Z">
    <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </path>
  <path d="M160 78l2 4 4 2-4 2-2 4-2-4-4-2 4-2Z">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1.4s" repeatCount="indefinite"/>
  </path>
</g>

<!-- Label -->
<text x="100" y="212" text-anchor="middle" font-family="Manrope,sans-serif" font-size="12" font-weight="800" fill="#25D8D1">Bundu</text>
</svg>
