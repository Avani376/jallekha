<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" role="img" aria-label="Three findings that look identical in a spreadsheet, and the different actions they need">
  <defs>
    <style>
      .tf-card{fill:#fff;stroke:#E2E8EC;stroke-width:2}
      .tf-title{font-family:'Segoe UI',sans-serif;font-size:17px;font-weight:800;fill:#0d2835}
      .tf-body{font-family:'Segoe UI',sans-serif;font-size:13.5px;fill:#52656f}
      .tf-action{font-family:'Segoe UI',sans-serif;font-size:13px;font-weight:700}
      .tf-glow1{animation:tf-g 2.8s ease-in-out infinite}
      .tf-glow2{animation:tf-g 2.8s ease-in-out .9s infinite}
      .tf-glow3{animation:tf-g 2.8s ease-in-out 1.8s infinite}
      @keyframes tf-g{0%,100%{stroke:#E2E8EC}50%{stroke:#25D8D1}}
      .tf-pair{animation:tf-pair 2.8s ease-in-out infinite}
      @keyframes tf-pair{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      .tf-link{stroke-dasharray:5 5;animation:tf-march 1.2s linear infinite}
      @keyframes tf-march{to{stroke-dashoffset:-20}}
      .tf-q{animation:tf-bob 3s ease-in-out infinite}
      @keyframes tf-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .tf-lens{animation:tf-sweep 3.4s ease-in-out infinite}
      @keyframes tf-sweep{0%,100%{transform:translate(-14px,5px)}50%{transform:translate(14px,-3px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>

  <!-- 1. duplicate receipt -->
  <g>
    <rect class="tf-card tf-glow1" x="30" y="20" width="330" height="216" rx="16"/>
    <g class="tf-pair">
      <rect x="58" y="46" width="118" height="52" rx="8" fill="#EAF6FB" stroke="#3188FF" stroke-width="2"/>
      <text x="117" y="68" text-anchor="middle" font-family="Consolas,monospace" font-size="14" font-weight="700" fill="#1d5fd0">R-101</text>
      <text x="117" y="87" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#52656f">5,000 L</text>
    </g>
    <rect x="88" y="74" width="118" height="52" rx="8" fill="#fff" stroke="#3188FF" stroke-width="2"/>
    <text x="147" y="96" text-anchor="middle" font-family="Consolas,monospace" font-size="14" font-weight="700" fill="#1d5fd0">R-101</text>
    <text x="147" y="115" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#52656f">5,000 L</text>
    <line class="tf-link" x1="214" y1="100" x2="264" y2="100" stroke="#E9AE45" stroke-width="3"/>
    <rect x="270" y="85" width="76" height="30" rx="15" fill="#FDF3E0" stroke="#E9AE45" stroke-width="2"/>
    <text x="308" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="800" fill="#8A5A00">candidate</text>
    <text class="tf-title" x="52" y="152">Duplicate receipt</text>
    <text class="tf-body" x="52" y="174">Same supplier + receipt + volume,</text>
    <text class="tf-body" x="52" y="192">entered twice from the legacy ledger.</text>
    <text class="tf-action" x="52" y="214" fill="#8A5A00">→ record-review: void one, keep history</text>
  </g>

  <!-- 2. missing reading -->
  <g>
    <rect class="tf-card tf-glow2" x="385" y="20" width="330" height="216" rx="16"/>
    <path d="M502 42c0 0 -25 29 -25 46a25 25 0 0 0 50 0c0 -17 -25 -46 -25 -46Z" fill="#EAF6FB" stroke="#3188FF" stroke-width="2.5"/>
    <text class="tf-q" x="502" y="94" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#1d5fd0">?</text>
    <path d="M455 118 h94" stroke="#B9C6CC" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
    <text x="556" y="72" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#8AA0AA">no closing dipstick</text>
    <text class="tf-title" x="407" y="152">Missing reading</text>
    <text class="tf-body" x="407" y="174">The equation cannot be evaluated —</text>
    <text class="tf-body" x="407" y="192">no residual is asserted. Never zero-filled.</text>
    <text class="tf-action" x="407" y="214" fill="#1d5fd0">→ measurement: take the reading</text>
  </g>

  <!-- 3. unexplained residual -->
  <g>
    <rect class="tf-card tf-glow3" x="740" y="20" width="330" height="216" rx="16"/>
    <path d="M865 42c0 0 -25 29 -25 46a25 25 0 0 0 50 0c0 -17 -25 -46 -25 -46Z" fill="#EAF6FB" stroke="#0E8A5F" stroke-width="2.5"/>
    <g class="tf-lens">
      <circle cx="874" cy="80" r="19" fill="#E3F5EC" stroke="#0E8A5F" stroke-width="3"/>
      <line x1="888" y1="94" x2="903" y2="109" stroke="#0E8A5F" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text class="tf-title" x="762" y="152">Unexplained residual</text>
    <text class="tf-body" x="762" y="174">Complete data, still outside the band —</text>
    <text class="tf-body" x="762" y="192">the cause is NOT determined.</text>
    <text class="tf-action" x="762" y="214" fill="#0E8A5F">→ investigation: verify, never accuse</text>
  </g>
</svg>
