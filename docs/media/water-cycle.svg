<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="700" height="180">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="#25D8D1"/>
  </marker>
  <marker id="arrow-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="#E9AE45"/>
  </marker>
</defs>
<rect width="700" height="180" fill="#061A24" rx="8"/>

<!-- Labels -->
<text x="70" y="30" text-anchor="middle" font-family="Manrope,sans-serif" font-size="13" font-weight="800" fill="#F5F8F7">Record</text>
<text x="250" y="30" text-anchor="middle" font-family="Manrope,sans-serif" font-size="13" font-weight="800" fill="#F5F8F7">Reconcile</text>
<text x="430" y="30" text-anchor="middle" font-family="Manrope,sans-serif" font-size="13" font-weight="800" fill="#F5F8F7">Investigate</text>
<text x="610" y="30" text-anchor="middle" font-family="Manrope,sans-serif" font-size="13" font-weight="800" fill="#F5F8F7">Resolve</text>

<!-- Icons -->
<rect x="45" y="45" width="50" height="40" rx="6" fill="#3188FF" opacity="0.2"/>
<text x="70" y="70" text-anchor="middle" font-size="18">📋</text>
<rect x="225" y="45" width="50" height="40" rx="6" fill="#25D8D1" opacity="0.2"/>
<text x="250" y="70" text-anchor="middle" font-size="18">⚖️</text>
<rect x="405" y="45" width="50" height="40" rx="6" fill="#E9AE45" opacity="0.2"/>
<text x="430" y="70" text-anchor="middle" font-size="18">🔍</text>
<rect x="585" y="45" width="50" height="40" rx="6" fill="#0E8A5F" opacity="0.2"/>
<text x="610" y="70" text-anchor="middle" font-size="18">✅</text>

<!-- Animated flow arrows -->
<line x1="100" y1="65" x2="180" y2="65" stroke="#25D8D1" strokeWidth="2" marker-end="url(#arrow)">
  <animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
</line>
<line x1="300" y1="65" x2="360" y2="65" stroke="#25D8D1" strokeWidth="2" marker-end="url(#arrow)">
  <animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.8s" begin="0.3s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
</line>
<line x1="480" y1="65" x2="540" y2="65" stroke="#25D8D1" strokeWidth="2" marker-end="url(#arrow)">
  <animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.8s" begin="0.6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
</line>

<!-- Feedback loop (dashed, amber) -->
<path d="M610 105 Q610 145 350 145 Q90 145 70 95" fill="none" stroke="#E9AE45" strokeWidth="1.5" strokeDasharray="5,3" marker-end="url(#arrow-r)">
  <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
</path>
<text x="350" y="160" text-anchor="middle" font-family="Manrope,sans-serif" font-size="10" fill="#E9AE45" opacity="0.7">continuous review loop</text>

<!-- Bottom labels -->
<text x="70" y="105" text-anchor="middle" font-family="Manrope,sans-serif" font-size="8" fill="#94A3B8">receipts + readings</text>
<text x="250" y="105" text-anchor="middle" font-family="Manrope,sans-serif" font-size="8" fill="#94A3B8">R = O + D − U − C</text>
<text x="430" y="105" text-anchor="middle" font-family="Manrope,sans-serif" font-size="8" fill="#94A3B8">evidence + verification</text>
<text x="610" y="105" text-anchor="middle" font-family="Manrope,sans-serif" font-size="8" fill="#94A3B8">documented outcome</text>

<!-- Anomaly pulse -->
<circle cx="350" cy="65" r="28" fill="none" stroke="#E9AE45" strokeWidth="1" opacity="0">
  <animate attributeName="r" values="28;38" dur="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.5;0" dur="2s" repeatCount="indefinite"/>
</circle>
</svg>
